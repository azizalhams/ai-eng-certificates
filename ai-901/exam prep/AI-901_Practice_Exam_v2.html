<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-901 Practice Exam — v2</title>
<style>
  :root{
    --ink:#1a2332;
    --paper:#f7f5f0;
    --azure:#0f6cbd;
    --azure-deep:#0a4d8c;
    --line:#d8d3c4;
    --good:#1c6e3e;
    --good-bg:#e6f4ea;
    --bad:#a02b2b;
    --bad-bg:#fbe9e7;
    --muted:#6b6557;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    padding-bottom:80px;
  }
  header{
    background:var(--azure-deep);
    color:#fff;
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  header h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:-0.01em;}
  header p{margin:0;color:#cfe3f5;font-size:0.9rem;}
  .meta-row{
    display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;
    font-size:0.78rem;color:#cfe3f5;
  }
  .meta-row span{background:rgba(255,255,255,0.12);padding:4px 10px;border-radius:20px;}

  #progress-bar-wrap{
    position:sticky;top:0;z-index:10;
    background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;
  }
  #progress-bar{height:6px;background:#e4ded0;border-radius:4px;overflow:hidden;}
  #progress-fill{height:100%;background:var(--azure);width:0%;transition:width 0.25s ease;}
  #progress-text{font-size:0.75rem;color:var(--muted);margin-top:6px;}

  main{max-width:720px;margin:0 auto;padding:20px;}

  .domain-divider{margin:30px 0 18px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
  .domain-divider h2{font-size:1rem;margin:0;text-transform:uppercase;letter-spacing:0.04em;}
  .domain-divider span{display:block;font-size:0.78rem;color:var(--muted);font-weight:400;margin-top:2px;text-transform:none;letter-spacing:normal;}

  .q-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:18px 18px 14px;margin-bottom:14px;transition:box-shadow 0.2s;
  }
  .q-num{font-size:0.72rem;font-weight:700;color:var(--azure);letter-spacing:0.04em;margin-bottom:6px;}
  .q-tag{
    display:inline-block;font-size:0.66rem;color:var(--muted);
    border:1px solid var(--line);border-radius:10px;padding:1px 7px;
    margin-left:6px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .q-text{font-size:0.97rem;font-weight:600;margin:0 0 12px;color:var(--ink);}
  .opt{
    display:flex;align-items:flex-start;gap:10px;padding:9px 10px;
    border-radius:7px;margin-bottom:6px;cursor:pointer;
    border:1px solid transparent;font-size:0.92rem;
  }
  .opt:hover{background:#f0ede4;}
  .opt input{margin-top:3px;accent-color:var(--azure);flex-shrink:0;}
  .opt-label-letter{font-weight:700;color:var(--muted);}

  .opt.correct-answer{background:var(--good-bg);border-color:var(--good);}
  .opt.correct-answer .opt-label-letter{color:var(--good);}
  .opt.wrong-pick{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong-pick .opt-label-letter{color:var(--bad);}

  .q-status{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:0.85rem;}
  .q-status.show{display:block;}
  .q-status .tag{display:inline-block;font-weight:700;font-size:0.78rem;padding:2px 9px;border-radius:12px;margin-bottom:6px;}
  .q-status .tag.right{background:var(--good-bg);color:var(--good);}
  .q-status .tag.wrong{background:var(--bad-bg);color:var(--bad);}
  .explain{color:var(--ink);opacity:0.85;}

  .submit-zone{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,var(--paper) 70%,rgba(247,245,240,0));
    padding:26px 20px 18px;display:flex;justify-content:center;z-index:20;
  }
  #submitBtn{
    background:var(--azure);color:#fff;border:none;
    padding:13px 34px;font-size:0.95rem;font-weight:700;
    border-radius:30px;cursor:pointer;
    box-shadow:0 4px 14px rgba(15,108,189,0.35);
    transition:transform 0.1s,background 0.2s;
  }
  #submitBtn:hover{background:var(--azure-deep);}
  #submitBtn:active{transform:scale(0.97);}
  #submitBtn:disabled{background:#aab2bd;box-shadow:none;cursor:not-allowed;}

  #results-banner{display:none;max-width:720px;margin:0 auto 10px;padding:0 20px;}
  .score-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;}
  .score-card .big-score{font-size:2.6rem;font-weight:800;color:var(--azure-deep);line-height:1;}
  .score-card .scaled{font-size:0.95rem;color:var(--muted);margin-top:4px;}
  .pass-pill{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:20px;font-weight:700;font-size:0.85rem;}
  .pass-pill.pass{background:var(--good-bg);color:var(--good);}
  .pass-pill.fail{background:var(--bad-bg);color:var(--bad);}
  .domain-breakdown{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
  .domain-breakdown div{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;}
  .domain-breakdown .d-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;}
  .domain-breakdown .d-score{font-size:1.2rem;font-weight:700;color:var(--ink);}
  #jumpToReview{
    margin-top:16px;background:none;border:1px solid var(--azure);
    color:var(--azure);padding:9px 18px;border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;
  }

  /* Export buttons */
  .export-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .export-btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 20px;
    border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;
    border:none;transition:opacity 0.15s,transform 0.1s;
  }
  .export-btn:hover{opacity:0.85;}
  .export-btn:active{transform:scale(0.97);}
  .export-btn.pdf{background:#0a4d8c;color:#fff;}
  .export-btn.dl{background:#1c6e3e;color:#fff;}

  body.submitted .opt{cursor:default;}
  body.submitted .opt:hover{background:inherit;}
  body:not(.submitted) .submit-zone{display:flex;}
  body.submitted .submit-zone{display:none;}

  /* Print */
  @media print{
    #progress-bar-wrap,.submit-zone,.export-btns,#jumpToReview{display:none!important;}
    body{background:#fff!important;padding-bottom:0;}
    header{background:#0a4d8c!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .opt.correct-answer{background:#e6f4ea!important;border-color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .opt.wrong-pick{background:#fbe9e7!important;border-color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-status{display:block!important;}
    .q-status .tag.right{background:#e6f4ea!important;color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-status .tag.wrong{background:#fbe9e7!important;color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pass-pill.pass{background:#e6f4ea!important;color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pass-pill.fail{background:#fbe9e7!important;color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-card{break-inside:avoid;page-break-inside:avoid;}
    #results-banner{display:block!important;}
    .score-card{break-inside:avoid;}
  }
</style>
</head>
<body>

<header>
  <h1>AI-901 Practice Exam — v2</h1>
  <p>Microsoft Azure AI Fundamentals — full-length practice run</p>
  <div class="meta-row">
    <span>50 questions</span>
    <span>Pass mark 700/1000</span>
    <span>Domain 1: Concepts &amp; Responsible AI</span>
    <span>Domain 2: Microsoft Foundry</span>
  </div>
</header>

<div id="progress-bar-wrap">
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="progress-text">0 of 50 answered</div>
</div>

<div id="results-banner"></div>
<main id="quiz-root"></main>

<div class="submit-zone">
  <button id="submitBtn" disabled>Answer all questions to submit</button>
</div>

<script>
const QUESTIONS = [
// ── DOMAIN 1: AI Concepts & Responsible AI (Q1–22) ──────────────────────────
{d:1,multi:false,
q:"A company wants to predict whether a bank loan applicant will default — a yes-or-no outcome. What type of machine learning is most appropriate?",
opts:[
  "Regression, which predicts a continuous numeric value such as a default probability score",
  "Clustering, which groups applicants with similar financial profiles into segments",
  "Reinforcement learning, which optimizes decisions through a reward-and-penalty feedback loop",
  "Binary classification, which predicts one of two discrete outcome categories"
],correct:[3],
exp:"Binary classification predicts one of two discrete labels (default / no default). Regression predicts continuous values. Clustering finds natural groupings without labels. Reinforcement learning learns via trial-and-error rewards, not from labeled historical data."},

{d:1,multi:false,
q:"A mortgage approval model denies applications from female applicants at a 15% higher rate than equally qualified male applicants. Which responsible AI principle is most directly violated?",
opts:[
  "Reliability and safety, because the model's predictions may be statistically inaccurate for some groups",
  "Transparency, because applicants cannot see the factors that contributed to their denial",
  "Fairness, because the system produces systematically different outcomes for a protected group",
  "Accountability, because no human reviewer is examining the automated denial decisions"
],correct:[2],
exp:"Fairness requires that AI systems treat all groups equitably. Producing worse outcomes for a protected characteristic (gender) is a fairness failure. Transparency, accountability, and reliability are all also relevant principles, but the core violation here is disparate impact on a protected group."},

{d:1,multi:false,
q:"A computer vision model pre-trained on millions of general images is adapted to identify five types of factory defects using only 200 labeled photos. What technique is this?",
opts:[
  "Fine-tuning from scratch, because the new defect categories require completely resetting the model's learned weights",
  "Reinforcement learning, because the model receives a reward signal each time it correctly identifies a defect",
  "Unsupervised learning, because factory defects are discovered without predefined class labels",
  "Transfer learning, because knowledge the model learned in its original domain is applied to a new task"
],correct:[3],
exp:"Transfer learning reuses representations already learned during pre-training and adapts them with limited new data. 'Fine-tuning from scratch' is a contradiction — fine-tuning builds on existing weights. RL requires rewards not labeled examples. Unsupervised learning uses no labels at all."},

{d:1,multi:false,
q:"Which evaluation metric is most appropriate for a model that predicts apartment rental prices?",
opts:[
  "Precision and recall, which measure the proportion of correctly identified positive and negative cases",
  "F1 score, which balances precision and recall across imbalanced classification datasets",
  "Mean absolute error, which measures the average difference between predicted and actual numeric values",
  "Area under the ROC curve, which evaluates a model's ability to separate two discrete classes"
],correct:[2],
exp:"Mean absolute error (and RMSE) are regression metrics that quantify the size of prediction errors for continuous outputs. Precision, recall, F1, and AUC-ROC are all classification metrics that require discrete predicted classes rather than continuous values."},

{d:1,multi:false,
q:"Which statement best describes what the transparency principle of responsible AI requires?",
opts:[
  "AI systems should be able to explain their decisions in terms that the affected people can understand",
  "AI systems should be developed by teams that reflect the diversity of the populations they serve",
  "AI systems should achieve the highest possible accuracy score on a held-out benchmark test set",
  "AI systems should store all user data in encrypted, anonymized form to prevent unauthorized access"
],correct:[0],
exp:"Transparency means AI behavior and decisions should be understandable and explainable to those who are affected. Diverse teams relate to inclusiveness. Benchmark accuracy is a quality goal, not transparency. Encrypted storage relates to the privacy and security principle."},

{d:1,multi:false,
q:"A model scores 98% accuracy on its training data but only 62% on the held-out test set. What is this failure mode called?",
opts:[
  "Underfitting, because the model has not captured sufficient patterns from the training data",
  "Data drift, because the distribution of test data differs from the distribution the model was trained on",
  "Overfitting, because the model memorized training examples instead of learning generalizable patterns",
  "Class imbalance, because the training set contains a disproportionate number of one outcome class"
],correct:[2],
exp:"Overfitting occurs when a model learns the training data so specifically that it fails to generalize. Underfitting is the opposite (poor on both sets). Data drift describes changes in production data over time, not a training-vs-test gap. Class imbalance can cause accuracy problems but is a separate issue."},

{d:1,multi:false,
q:"An app lets users upload a photo and ask a natural language question about it, such as 'How many people are in this image?' What AI workload combination does this require?",
opts:[
  "Natural language processing only, because the output is a text answer to a text question",
  "Computer vision only, because the primary input the model must interpret is an image",
  "A combination of computer vision and natural language processing working together",
  "Knowledge mining, because the system extracts structured information from unstructured content"
],correct:[2],
exp:"Understanding the image requires computer vision; interpreting the natural language question and generating a text answer requires NLP. Neither capability alone is sufficient for this multimodal task. Knowledge mining typically refers to indexing large document collections, not interactive Q&A."},

{d:1,multi:false,
q:"A criminal sentencing support tool makes recommendations automatically with no appeal mechanism, no human review, and no audit trail. Which responsible AI principle is most at risk?",
opts:[
  "Reliability and safety, because the model may produce inaccurate or inconsistent sentencing recommendations",
  "Privacy and security, because criminal records contain highly sensitive personal information",
  "Fairness, because the model's recommendations may reflect historical biases in sentencing data",
  "Accountability, because there is no mechanism for human oversight or responsibility for outcomes"
],correct:[3],
exp:"Accountability requires clear lines of responsibility, human oversight, and recourse mechanisms — especially for high-stakes decisions. While fairness (C) and reliability (A) are also genuine concerns, the complete absence of human review or appeal most directly violates accountability."},

{d:1,multi:false,
q:"A spam filter is trained on 50,000 emails that human reviewers have manually labeled 'spam' or 'not spam.' What type of machine learning does this represent?",
opts:[
  "Unsupervised learning, because the model identifies spam patterns without any external guidance",
  "Reinforcement learning, because the model improves each time a user corrects a misclassified email",
  "Supervised learning, because the model is trained on human-labeled examples with known correct outputs",
  "Semi-supervised learning, because only a fraction of all available emails have been reviewed by humans"
],correct:[2],
exp:"Supervised learning trains on labeled data with known outputs. Unsupervised learning finds structure without labels. RL learns through reward signals, not pre-labeled datasets. Semi-supervised uses a mix of labeled and unlabeled data — not the case here where all 50,000 are labeled."},

{d:1,multi:false,
q:"Which of the following is a well-documented limitation of large language models?",
opts:[
  "They cannot generate output in more than one language during a single conversation session",
  "They require the user to specify a programming language explicitly before generating any code",
  "They are unable to produce creative or narrative content and are limited to factual summaries",
  "They have a training data cutoff and may lack accurate knowledge of events after that date"
],correct:[3],
exp:"LLMs have a fixed knowledge cutoff and cannot access information about events after their training data ends — unless given retrieval tools. The other options are all incorrect: LLMs routinely generate multilingual output, write code without explicit language specification, and excel at creative writing."},

{d:1,multi:true,
q:"Which of the following are examples of generative AI outputs? (Select all that apply)",
opts:[
  "A written summary of a lengthy legal contract produced from the original document",
  "A photorealistic product image generated from a text description",
  "Customer segments created by grouping users with similar behaviors using an unsupervised algorithm",
  "A Python function written by the model in response to a natural language description",
  "A probability score indicating the likelihood that a financial transaction is fraudulent"
],correct:[0,1,3],
exp:"Generative AI creates new content: a text summary (A), a synthetic image (B), and generated code (D) are all generative outputs. Customer segmentation (C) is unsupervised discriminative ML. Fraud probability scoring (E) is predictive ML — neither generates new content."},

{d:1,multi:false,
q:"A hospital trains a predictive model using patient records containing full names, dates of birth, and diagnoses, without obtaining patient consent or anonymizing the data. Which responsible AI principle is most directly violated?",
opts:[
  "Fairness, because demographic data in the records could introduce bias into the model's predictions",
  "Transparency, because patients were not informed that their records would be used to train an AI system",
  "Privacy and security, because identifiable personal health data was processed without appropriate safeguards or consent",
  "Reliability and safety, because health prediction models must meet strict clinical accuracy and validation standards"
],correct:[2],
exp:"Using identifiable personal health data without consent directly violates the privacy and security principle. While transparency (B) is also relevant — patients should be informed — the core violation is the improper handling of sensitive personal data without authorization or protection."},

{d:1,multi:false,
q:"In a supervised learning model that predicts apartment rental prices, which of the following is the label?",
opts:[
  "The monthly rental price the model is trained to predict",
  "The number of bedrooms and bathrooms in the apartment",
  "The distance from the apartment to the nearest public transit stop",
  "The neighborhood and postal code where the apartment is located"
],correct:[0],
exp:"The label is the output variable the model learns to predict — here, the rental price. All other options (bedrooms, transit distance, neighborhood) are input features that the model uses to generate that prediction."},

{d:1,multi:false,
q:"A customer service chatbot confidently states that the company's return policy is 30 days, when the policy was changed to 14 days six months ago. The model was never updated. What best describes this?",
opts:[
  "Model bias, because the training data contained a disproportionate number of examples about the old policy",
  "Data drift, because the real-world policy changed after the model was trained and deployed",
  "Overfitting, because the model memorized the 30-day policy from repetitive training examples",
  "Hallucination, because the model generated a confident but factually incorrect statement"
],correct:[3],
exp:"Hallucination is when a model produces confident misinformation. Data drift (B) is the underlying cause of the stale knowledge, but 'hallucination' specifically names the behavior of stating wrong facts with confidence. Bias and overfitting are separate phenomena."},

{d:1,multi:false,
q:"An AI system for screening job applications is extensively tested across demographic groups before launch, and human recruiters manually review all borderline cases. Which responsible AI principle does this most demonstrate?",
opts:[
  "Fairness, because all applicants are evaluated using a consistent set of criteria",
  "Inclusiveness, because the system is designed to consider candidates from all backgrounds",
  "Reliability and safety, because the system is rigorously tested and human oversight is built into the process",
  "Transparency, because applicants can see and understand how their applications were evaluated"
],correct:[2],
exp:"Reliability and safety involves testing AI systems to perform consistently and including human oversight for consequential decisions — both demonstrated here. Fairness, inclusiveness, and transparency each describe different characteristics of a responsible system and are not the primary principle illustrated."},

{d:1,multi:false,
q:"A self-driving vehicle system must assign a category to every single pixel in a camera frame: road, vehicle, pedestrian, or background. Which computer vision task is this?",
opts:[
  "Image classification, because the system assigns a single category label to each video frame",
  "Object detection, because the system identifies the location of objects using bounding boxes",
  "Semantic segmentation, because the system assigns a class label to every individual pixel in the image",
  "Optical character recognition, because the system must read road signs and lane markings"
],correct:[2],
exp:"Semantic segmentation assigns a class to each pixel. Image classification assigns one label to the whole image. Object detection draws bounding boxes around objects but does not label individual pixels. OCR reads printed text, not scene elements."},

{d:1,multi:false,
q:"A media company wants to automatically populate a database with the names of people, organizations, and geographic locations mentioned in news articles. Which NLP capability is most appropriate?",
opts:[
  "Sentiment analysis, which identifies the emotional tone expressed toward the entities in the article",
  "Named entity recognition, which identifies and categorizes specific named items such as people, organizations, and places",
  "Key phrase extraction, which surfaces the most statistically significant terms and topics in a document",
  "Language detection, which determines the language in which the article is written"
],correct:[1],
exp:"Named entity recognition (NER) identifies and classifies specific entities like people, organizations, and locations. Sentiment analysis measures tone. Key phrase extraction finds important terms but doesn't categorize them as entity types. Language detection identifies the language of the text."},

{d:1,multi:false,
q:"A generative AI model must always respond in a formal register, limit answers to three sentences, and decline any question not related to company policy. Where should these constraints be placed?",
opts:[
  "In every user message, repeating the instructions at the start of each new request",
  "In the model's fine-tuning dataset, which trains the model to follow these rules through example conversations",
  "In the system message, which defines persistent behavioral rules applied before each conversation turn",
  "In the content safety configuration, which filters model outputs that do not conform to the desired format"
],correct:[2],
exp:"The system message establishes persistent behavioral rules for the model across all turns. Repeating in user messages is unreliable. Fine-tuning (changing weights) is overkill for behavioral formatting. Content safety filters harmful content, not response style or topic scope."},

{d:1,multi:true,
q:"Which of the following are characteristics of a transparent AI system under Microsoft's responsible AI principles? (Select all that apply)",
opts:[
  "The system can provide explanations for its predictions that affected users can understand",
  "The system achieves above-average accuracy scores on standard industry benchmark datasets",
  "The system is clearly documented with its intended use, limitations, and potential failure modes",
  "The system is trained exclusively on publicly licensed and open-access data sources",
  "The system never produces errors or incorrect outputs under any operating conditions"
],correct:[0,2],
exp:"Transparency means explainability (A) and clear documentation of capabilities and limitations (C). Benchmark accuracy (B) is a quality goal, not a transparency property. Training data licensing (D) relates to other principles. Perfect accuracy (E) is unachievable and unrelated to transparency."},

{d:1,multi:false,
q:"A developer writes a system prompt instructing a model to act as a cooking assistant, maintain a friendly tone, and always include a recipe at the end of every response. This is an example of:",
opts:[
  "Fine-tuning, because the model's domain of expertise has been customized for cooking-related tasks",
  "Model pre-training, because the instructions define the objectives used during initial model training",
  "Retrieval-augmented generation, because external recipe data is retrieved to constrain the model's responses",
  "Prompt engineering, because the model's behavior is shaped entirely through crafted input instructions without modifying model weights"
],correct:[3],
exp:"Prompt engineering shapes model behavior through instructions without touching model weights. Fine-tuning retrains the model on new data. Pre-training is the large-scale initial training phase. RAG retrieves external content at query time — the system prompt here doesn't retrieve anything."},

{d:1,multi:false,
q:"Which statement correctly describes the relationship between artificial intelligence, machine learning, and deep learning?",
opts:[
  "The three fields are independent disciplines with overlapping techniques but no hierarchical relationship",
  "Machine learning is a subset of deep learning, which is itself a broader subset of artificial intelligence",
  "Deep learning is a subset of machine learning, which is itself a subset of artificial intelligence",
  "Artificial intelligence is the narrowest discipline, sitting inside machine learning, which sits inside deep learning"
],correct:[2],
exp:"AI is the broadest field encompassing any technique enabling machines to perform intelligent tasks. Machine learning is a subset of AI focused on learning from data. Deep learning is a subset of ML using multi-layer neural networks. The hierarchy is: AI ⊃ ML ⊃ Deep Learning."},

{d:1,multi:false,
q:"What is the key difference between object detection and image classification?",
opts:[
  "Object detection assigns a single label to the whole image; image classification locates and labels multiple objects within it",
  "Image classification assigns a single label to the whole image; object detection locates and labels multiple objects within it",
  "Object detection requires deep learning models; image classification uses only traditional rule-based pattern matching",
  "Image classification provides pixel-level class boundaries; object detection assigns only one label per image"
],correct:[1],
exp:"Image classification answers 'what is in this image overall?' with a single label. Object detection answers 'what objects are in this image and where?' with bounding boxes and labels for each. Semantic segmentation (not object detection) gives pixel-level boundaries."},

// ── DOMAIN 2: Implementing AI Solutions with Microsoft Foundry (Q23–50) ─────
{d:2,multi:false,
q:"What is the primary purpose of Microsoft Foundry (Azure AI Foundry)?",
opts:[
  "A version control platform for tracking changes to machine learning model weights and training datasets",
  "A dedicated cloud service for running large-scale batch ETL pipelines on structured enterprise data",
  "A unified platform for discovering, building, deploying, and managing AI applications and agents using foundation models",
  "A relational database hosting environment optimized for storing AI-generated structured query outputs"
],correct:[2],
exp:"Microsoft Foundry is a unified AI development platform covering model discovery, agent building, tool connection, safety evaluation, and deployment monitoring. The other options describe unrelated Azure infrastructure services."},

{d:2,multi:false,
q:"A company wants to add machine translation of product descriptions from English into 20 languages, without training a custom model. Which Azure AI service is most appropriate?",
opts:[
  "Azure AI Language with custom text classification, which categorizes text by topic across multiple languages",
  "Azure AI Translator, which provides pre-built API-based machine translation across many language pairs",
  "Azure AI Speech with speech translation, which converts spoken audio from one language to spoken audio in another",
  "Azure AI Content Understanding, which extracts structured information from multilingual documents and media"
],correct:[1],
exp:"Azure AI Translator offers ready-to-use translation APIs across many languages — no model training required. Custom text classification categorizes content but doesn't translate it. Speech translation works on audio, not written text. Content Understanding extracts structure, not translates content."},

{d:2,multi:false,
q:"Your organization's compliance policy documents are revised monthly. You need a model that can answer questions accurately based on the current policy. Which approach is most suitable?",
opts:[
  "Use retrieval-augmented generation, connecting the model to an updated document index it searches at query time",

const LETTERS = ['A','B','C','D','E'];
const userAnswers = QUESTIONS.map(()=>new Set());
let submitted = false;

const root = document.getElementById('quiz-root');
let currentDomain = null;

QUESTIONS.forEach((item, qi) => {
  if(item.d !== currentDomain){
    currentDomain = item.d;
    const div = document.createElement('div');
    div.className = 'domain-divider';
    div.innerHTML = currentDomain === 1
      ? `<h2>Domain 1 — AI Concepts &amp; Responsible AI</h2><span>Questions 1–22 · ~44% of exam weight</span>`
      : `<h2>Domain 2 — Implementing AI Solutions with Microsoft Foundry</h2><span>Questions 23–50 · ~56% of exam weight</span>`;
    root.appendChild(div);
  }

  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'card-' + qi;

  const numDiv = document.createElement('div');
  numDiv.className = 'q-num';
  numDiv.textContent = 'QUESTION ' + (qi+1) + ' OF 50';
  if(item.multi){
    const tag = document.createElement('span');
    tag.className = 'q-tag';
    tag.textContent = 'Multi-select';
    numDiv.appendChild(tag);
  }
  card.appendChild(numDiv);

  const qText = document.createElement('p');
  qText.className = 'q-text';
  qText.textContent = item.q;
  card.appendChild(qText);

  item.opts.forEach((optText, oi) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.id = `opt-${qi}-${oi}`;
    const input = document.createElement('input');
    input.type = item.multi ? 'checkbox' : 'radio';
    input.name = 'q' + qi;
    input.value = oi;
    input.addEventListener('change', () => {
      if(submitted) return;
      if(item.multi){
        if(input.checked) userAnswers[qi].add(oi); else userAnswers[qi].delete(oi);
      } else {
        userAnswers[qi] = new Set([oi]);
      }
      updateProgress();
      saveProgress();
    });
    const letterSpan = document.createElement('span');
    letterSpan.className = 'opt-label-letter';
    letterSpan.textContent = LETTERS[oi] + '.';
    const textSpan = document.createElement('span');
    textSpan.textContent = optText;
    label.appendChild(input);
    label.appendChild(letterSpan);
    label.appendChild(textSpan);
    card.appendChild(label);
  });

  const status = document.createElement('div');
  status.className = 'q-status';
  status.id = 'status-' + qi;
  card.appendChild(status);

  root.appendChild(card);
});

function updateProgress(){
  const answered = userAnswers.filter(s => s.size > 0).length;
  document.getElementById('progress-fill').style.width = (answered/50*100) + '%';
  document.getElementById('progress-text').textContent = answered + ' of 50 answered';
  const btn = document.getElementById('submitBtn');
  if(answered === 50){
    btn.disabled = false;
    btn.textContent = 'Submit exam';
  } else {
    btn.disabled = true;
    btn.textContent = (50 - answered) + ' question' + (50-answered===1?'':'s') + ' remaining';
  }
}

document.getElementById('submitBtn').addEventListener('click', () => {
  submitted = true;
  document.body.classList.add('submitted');
  sessionStorage.removeItem('ai901_v2');

  let correctCount = 0;
  let d1Total = 0, d1Correct = 0, d2Total = 0, d2Correct = 0;

  QUESTIONS.forEach((item, qi) => {
    const correctSet = new Set(item.correct);
    const userSet = userAnswers[qi];
    const isRight = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    if(isRight) correctCount++;
    if(item.d === 1){ d1Total++; if(isRight) d1Correct++; }
    else { d2Total++; if(isRight) d2Correct++; }

    item.opts.forEach((optText, oi) => {
      const optEl = document.getElementById(`opt-${qi}-${oi}`);
      const input = optEl.querySelector('input');
      input.disabled = true;
      if(correctSet.has(oi)){
        optEl.classList.add('correct-answer');
      } else if(userSet.has(oi)){
        optEl.classList.add('wrong-pick');
      }
    });

    const statusEl = document.getElementById('status-' + qi);
    statusEl.classList.add('show');
    statusEl.innerHTML = `<span class="tag ${isRight?'right':'wrong'}">${isRight?'Correct':'Incorrect'}</span><div class="explain">${item.exp}</div>`;
  });

  const pct = Math.round(correctCount/50*100);
  const scaled = Math.round(correctCount/50*1000);
  const passed = scaled >= 700;

  const banner = document.getElementById('results-banner');
  banner.style.display = 'block';
  banner.innerHTML = `
    <div class="score-card">
      <div class="big-score">${correctCount}/50</div>
      <div class="scaled">${pct}% correct &nbsp;·&nbsp; scaled score ≈ ${scaled}/1000</div>
      <div class="pass-pill ${passed?'pass':'fail'}">${passed?'PASS':'BELOW PASSING (700)'}</div>
      <div class="domain-breakdown">
        <div><div class="d-label">Domain 1 · Concepts</div><div class="d-score">${d1Correct}/${d1Total}</div></div>
        <div><div class="d-label">Domain 2 · Foundry</div><div class="d-score">${d2Correct}/${d2Total}</div></div>
      </div>
      <br>
      <button id="jumpToReview">Review all questions</button>
      <div class="export-btns">
        <button class="export-btn pdf" onclick="printPDF()">🖨️ Save as PDF</button>
        <button class="export-btn dl" onclick="downloadHTML()">⬇️ Download Results HTML</button>
      </div>
    </div>
  `;
  document.getElementById('jumpToReview').addEventListener('click', () => {
    document.getElementById('card-0').scrollIntoView({behavior:'smooth',block:'start'});
  });
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ── sessionStorage: save & restore in-progress answers ── */
function saveProgress(){
  try{ sessionStorage.setItem('ai901_v2', JSON.stringify(userAnswers.map(s=>[...s]))); }catch(e){}
}
function restoreProgress(){
  try{
    const raw = sessionStorage.getItem('ai901_v2');
    if(!raw) return;
    const data = JSON.parse(raw);
    data.forEach((arr, qi) => {
      if(!arr.length) return;
      userAnswers[qi] = new Set(arr);
      arr.forEach(oi => {
        const input = document.querySelector(`input[name="q${qi}"][value="${oi}"]`);
        if(input) input.checked = true;
      });
    });
    updateProgress();
  }catch(e){}
}

/* ── Save as PDF ── */
function printPDF(){ window.print(); }

/* ── Download static results HTML ── */
function downloadHTML(){
  const L = ['A','B','C','D','E'];
  let correct=0,d1C=0,d1T=0,d2C=0,d2T=0;
  const results = QUESTIONS.map((item,qi)=>{
    const cs=new Set(item.correct),us=userAnswers[qi];
    const ok=cs.size===us.size&&[...cs].every(x=>us.has(x));
    if(ok)correct++;
    if(item.d===1){d1T++;if(ok)d1C++;}else{d2T++;if(ok)d2C++;}
    return{ok,cs,us};
  });
  const pct=Math.round(correct/50*100),scaled=Math.round(correct/50*1000),passed=scaled>=700;
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  let qHTML='';let curD=null;
  QUESTIONS.forEach((item,qi)=>{
    const{ok,cs,us}=results[qi];
    if(item.d!==curD){
      curD=item.d;
      qHTML+=curD===1
        ?`<div class="dd"><h2>DOMAIN 1 — AI CONCEPTS &amp; RESPONSIBLE AI</h2><span>Questions 1–22 · ~44% of exam weight</span></div>`
        :`<div class="dd"><h2>DOMAIN 2 — IMPLEMENTING AI SOLUTIONS WITH MICROSOFT FOUNDRY</h2><span>Questions 23–50 · ~56% of exam weight</span></div>`;
    }
    let optsHTML='';
    item.opts.forEach((t,oi)=>{
      const ic=cs.has(oi),iw=us.has(oi)&&!ic;
      const cls=ic?'correct':iw?'wrong':'';
      const icon=ic?'✓ ':iw?'✗ ':'';
      optsHTML+=`<div class="opt ${cls}"><span class="lt">${icon}${L[oi]}.</span><span>${t}</span></div>`;
    });
    qHTML+=`<div class="qc"><div class="qn">QUESTION ${qi+1} OF 50${item.multi?' <span class="mt">MULTI-SELECT</span>':''}</div><div class="qt">${item.q}</div>${optsHTML}<div class="ex"><span class="badge ${ok?'right':'wrong'}">${ok?'Correct':'Incorrect'}</span>${item.exp}</div></div>`;
  });

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI-901 Results — ${date}</title><style>:root{--good:#1c6e3e;--good-bg:#e6f4ea;--bad:#a02b2b;--bad-bg:#fbe9e7;--azure:#0a4d8c;--line:#d8d3c4;--ink:#1a2332;--muted:#6b6557;}*{box-sizing:border-box;}body{margin:0;background:#f7f5f0;color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;padding-bottom:40px;}header{background:var(--azure);color:#fff;padding:24px 20px 20px;}header h1{margin:0 0 4px;font-size:1.4rem;}header p{margin:0;color:#cfe3f5;font-size:.85rem;}main{max-width:700px;margin:0 auto;padding:20px;}.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;margin-bottom:24px;}.big{font-size:2.4rem;font-weight:800;color:var(--azure);line-height:1;}.sub{color:var(--muted);font-size:.9rem;margin-top:4px;}.pill{display:inline-block;margin-top:10px;padding:5px 16px;border-radius:20px;font-weight:700;font-size:.85rem;}.pill.pass{background:var(--good-bg);color:var(--good);}.pill.fail{background:var(--bad-bg);color:var(--bad);}.bk{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap;}.bk div{flex:1;min-width:120px;background:#f7f5f0;border:1px solid var(--line);border-radius:8px;padding:10px;}.dl{font-size:.7rem;color:var(--muted);text-transform:uppercase;}.ds{font-size:1.2rem;font-weight:700;}.dd{margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink);}.dd h2{font-size:.9rem;margin:0;letter-spacing:.04em;}.dd span{font-size:.74rem;color:var(--muted);}.qc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;page-break-inside:avoid;break-inside:avoid;}.qn{font-size:.7rem;font-weight:700;color:#0f6cbd;letter-spacing:.04em;margin-bottom:6px;}.mt{font-size:.6rem;background:#f0ede4;border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-left:6px;color:var(--muted);font-weight:400;}.qt{font-size:.95rem;font-weight:600;margin:0 0 10px;}.opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:5px;border:1px solid transparent;font-size:.88rem;}.opt.correct{background:var(--good-bg);border-color:var(--good);}.opt.wrong{background:var(--bad-bg);border-color:var(--bad);}.lt{font-weight:700;flex-shrink:0;min-width:22px;}.opt.correct .lt{color:var(--good);}.opt.wrong .lt{color:var(--bad);}.ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.84rem;}.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px;}.badge.right{background:var(--good-bg);color:var(--good);}.badge.wrong{background:var(--bad-bg);color:var(--bad);}@media print{body{background:#fff!important;}.opt.correct,.opt.wrong,.badge,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.qc{break-inside:avoid;}}</style></head><body><header><h1>AI-901 Practice Exam — Results</h1><p>Completed ${date}</p></header><main><div class="sc"><div class="big">${correct}/50</div><div class="sub">${pct}% correct &nbsp;·&nbsp; scaled score ≈ ${scaled}/1000</div><div class="pill ${passed?'pass':'fail'}">${passed?'PASS':'BELOW PASSING (700)'}</div><div class="bk"><div><div class="dl">Domain 1 · Concepts</div><div class="ds">${d1C}/${d1T}</div></div><div><div class="dl">Domain 2 · Foundry</div><div class="ds">${d2C}/${d2T}</div></div></div></div>${qHTML}</main></body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='AI-901_Results_v2_'+new Date().toISOString().slice(0,10)+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

updateProgress();
restoreProgress();
</script>
