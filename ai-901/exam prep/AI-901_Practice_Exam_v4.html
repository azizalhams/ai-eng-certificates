<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-901 Practice Exam — v4</title>
<style>
  :root{
    --ink:#1a2332;
    --paper:#f7f5f0;
    --azure:#0f6cbd;
    --azure-deep:#0a4d8c;
    --line:#d8d3c4;
    --good:#1c6e3e;
    --good-bg:#e6f4ea;
    --bad:#a02b2b;
    --bad-bg:#fbe9e7;
    --muted:#6b6557;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    padding-bottom:80px;
  }
  header{
    background:var(--azure-deep);
    color:#fff;
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  header h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:-0.01em;}
  header p{margin:0;color:#cfe3f5;font-size:0.9rem;}
  .meta-row{
    display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;
    font-size:0.78rem;color:#cfe3f5;
  }
  .meta-row span{background:rgba(255,255,255,0.12);padding:4px 10px;border-radius:20px;}

  #progress-bar-wrap{
    position:sticky;top:0;z-index:10;
    background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;
  }
  #progress-bar{height:6px;background:#e4ded0;border-radius:4px;overflow:hidden;}
  #progress-fill{height:100%;background:var(--azure);width:0%;transition:width 0.25s ease;}
  #progress-text{font-size:0.75rem;color:var(--muted);margin-top:6px;}

  main{max-width:720px;margin:0 auto;padding:20px;}

  .domain-divider{margin:30px 0 18px;padding-bottom:8px;border-bottom:2px solid var(--ink);}
  .domain-divider h2{font-size:1rem;margin:0;text-transform:uppercase;letter-spacing:0.04em;}
  .domain-divider span{display:block;font-size:0.78rem;color:var(--muted);font-weight:400;margin-top:2px;text-transform:none;letter-spacing:normal;}

  .q-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:18px 18px 14px;margin-bottom:14px;transition:box-shadow 0.2s;
  }
  .q-num{font-size:0.72rem;font-weight:700;color:var(--azure);letter-spacing:0.04em;margin-bottom:6px;}
  .q-tag{
    display:inline-block;font-size:0.66rem;color:var(--muted);
    border:1px solid var(--line);border-radius:10px;padding:1px 7px;
    margin-left:6px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .q-text{font-size:0.97rem;font-weight:600;margin:0 0 12px;color:var(--ink);}
  .opt{
    display:flex;align-items:flex-start;gap:10px;padding:9px 10px;
    border-radius:7px;margin-bottom:6px;cursor:pointer;
    border:1px solid transparent;font-size:0.92rem;
  }
  .opt:hover{background:#f0ede4;}
  .opt input{margin-top:3px;accent-color:var(--azure);flex-shrink:0;}
  .opt-label-letter{font-weight:700;color:var(--muted);}

  .opt.correct-answer{background:var(--good-bg);border-color:var(--good);}
  .opt.correct-answer .opt-label-letter{color:var(--good);}
  .opt.wrong-pick{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong-pick .opt-label-letter{color:var(--bad);}

  .q-status{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:0.85rem;}
  .q-status.show{display:block;}
  .q-status .tag{display:inline-block;font-weight:700;font-size:0.78rem;padding:2px 9px;border-radius:12px;margin-bottom:6px;}
  .q-status .tag.right{background:var(--good-bg);color:var(--good);}
  .q-status .tag.wrong{background:var(--bad-bg);color:var(--bad);}
  .explain{color:var(--ink);opacity:0.85;}

  .submit-zone{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(0deg,var(--paper) 70%,rgba(247,245,240,0));
    padding:26px 20px 18px;display:flex;justify-content:center;z-index:20;
  }
  #submitBtn{
    background:var(--azure);color:#fff;border:none;
    padding:13px 34px;font-size:0.95rem;font-weight:700;
    border-radius:30px;cursor:pointer;
    box-shadow:0 4px 14px rgba(15,108,189,0.35);
    transition:transform 0.1s,background 0.2s;
  }
  #submitBtn:hover{background:var(--azure-deep);}
  #submitBtn:active{transform:scale(0.97);}
  #submitBtn:disabled{background:#aab2bd;box-shadow:none;cursor:not-allowed;}

  #results-banner{display:none;max-width:720px;margin:0 auto 10px;padding:0 20px;}
  .score-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;}
  .score-card .big-score{font-size:2.6rem;font-weight:800;color:var(--azure-deep);line-height:1;}
  .score-card .scaled{font-size:0.95rem;color:var(--muted);margin-top:4px;}
  .pass-pill{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:20px;font-weight:700;font-size:0.85rem;}
  .pass-pill.pass{background:var(--good-bg);color:var(--good);}
  .pass-pill.fail{background:var(--bad-bg);color:var(--bad);}
  .domain-breakdown{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap;}
  .domain-breakdown div{flex:1;min-width:140px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;}
  .domain-breakdown .d-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;}
  .domain-breakdown .d-score{font-size:1.2rem;font-weight:700;color:var(--ink);}
  #jumpToReview{
    margin-top:16px;background:none;border:1px solid var(--azure);
    color:var(--azure);padding:9px 18px;border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;
  }

  /* Export buttons */
  .export-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .export-btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 20px;
    border-radius:20px;font-size:0.85rem;font-weight:700;cursor:pointer;
    border:none;transition:opacity 0.15s,transform 0.1s;
  }
  .export-btn:hover{opacity:0.85;}
  .export-btn:active{transform:scale(0.97);}
  .export-btn.pdf{background:#0a4d8c;color:#fff;}
  .export-btn.dl{background:#1c6e3e;color:#fff;}

  body.submitted .opt{cursor:default;}
  body.submitted .opt:hover{background:inherit;}
  body:not(.submitted) .submit-zone{display:flex;}
  body.submitted .submit-zone{display:none;}

  /* Print */
  @media print{
    #progress-bar-wrap,.submit-zone,.export-btns,#jumpToReview{display:none!important;}
    body{background:#fff!important;padding-bottom:0;}
    header{background:#0a4d8c!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .opt.correct-answer{background:#e6f4ea!important;border-color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .opt.wrong-pick{background:#fbe9e7!important;border-color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-status{display:block!important;}
    .q-status .tag.right{background:#e6f4ea!important;color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-status .tag.wrong{background:#fbe9e7!important;color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pass-pill.pass{background:#e6f4ea!important;color:#1c6e3e!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pass-pill.fail{background:#fbe9e7!important;color:#a02b2b!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .q-card{break-inside:avoid;page-break-inside:avoid;}
    #results-banner{display:block!important;}
    .score-card{break-inside:avoid;}
  }
</style>
</head>
<body>

<header>
  <h1>AI-901 Practice Exam — v4</h1>
  <p>Microsoft Azure AI Fundamentals — full-length practice run</p>
  <div class="meta-row">
    <span>50 questions</span>
    <span>Pass mark 700/1000</span>
    <span>Domain 1: Concepts &amp; Responsible AI</span>
    <span>Domain 2: Microsoft Foundry</span>
  </div>
</header>

<div id="progress-bar-wrap">
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="progress-text">0 of 50 answered</div>
</div>

<div id="results-banner"></div>
<main id="quiz-root"></main>

<div class="submit-zone">
  <button id="submitBtn" disabled>Answer all questions to submit</button>
</div>

<script>
const QUESTIONS = [
// ── DOMAIN 1: AI Concepts & Responsible AI (Q1–22) ──────────────────────────
{d:1,multi:false,
q:"An insurance company wants a model to assign each incoming claim to one of four risk tiers: low, medium, high, or critical. What type of machine learning task is this?",
opts:[
  "Regression, because the model outputs a continuous numeric risk score for each claim",
  "Multiclass classification, because the model assigns each claim to one of several discrete categories",
  "Clustering, because claims are grouped into tiers without any predefined category labels",
  "Anomaly detection, because the model flags claims that deviate from typical patterns"
],correct:[1],
exp:"Assigning items to one of several predefined discrete categories (low/medium/high/critical) is multiclass classification. Regression predicts continuous numbers, not category labels. Clustering doesn't use predefined labels — here the four tiers are defined in advance. Anomaly detection flags outliers, not routine categorization."},

{d:1,multi:false,
q:"A voice-based loan approval system is found to have a significantly higher error rate when processing speech from non-native English speakers, leading to more incorrect denials for that group. Which responsible AI principle is most directly at stake?",
opts:[
  "Fairness, because the system's error rate differs meaningfully across a specific population group",
  "Privacy and security, because voice recordings contain biometric data that must be protected",
  "Transparency, because applicants are not told how the voice recognition system reaches its decision",
  "Accountability, because no specific individual has been assigned responsibility for the system's errors"
],correct:[0],
exp:"A meaningfully higher error rate for one population group producing worse outcomes (incorrect denials) is a textbook fairness issue — unequal system performance across groups. The other principles may be secondary concerns, but the described harm is fundamentally about unequal treatment."},

{d:1,multi:false,
q:"A team pre-trains a large model on billions of general web pages, and then further trains it specifically on legal contracts before deploying it for contract review. What is this second stage called?",
opts:[
  "Prompt engineering, because the model's inputs are being carefully crafted for the legal domain",
  "Fine-tuning, because the model's weights are further adjusted using a smaller, domain-specific dataset",
  "Retrieval-augmented generation, because the model retrieves legal documents from an external index at query time",
  "Anomaly detection, because the model flags unusual clauses within each contract it reviews"
],correct:[1],
exp:"Fine-tuning further trains an already pre-trained model's weights on a smaller, specialized dataset — exactly what's described. Prompt engineering shapes input without touching weights. RAG retrieves external content at inference time rather than adjusting weights. Anomaly detection is an unrelated downstream task."},

{d:1,multi:false,
q:"Which evaluation metric would be most useful for assessing a binary classification model where both false positives and false negatives carry roughly equal cost, and the classes are relatively balanced?",
opts:[
  "Mean squared error, which measures the average squared difference between predicted and actual continuous values",
  "Accuracy, which measures the overall proportion of correct predictions across all classes",
  "R-squared, which measures how much variance in a continuous target variable is explained by the model",
  "Mean absolute error, which measures the average magnitude of prediction errors in a regression task"
],correct:[1],
exp:"Accuracy is a reasonable metric when classes are balanced and the cost of false positives and false negatives is roughly equal. Mean squared error, R-squared, and mean absolute error are all regression metrics used for continuous outputs, not classification tasks."},

{d:1,multi:false,
q:"Which statement best captures what the privacy and security principle of responsible AI requires from an organization deploying an AI system?",
opts:[
  "The system must achieve state-of-the-art accuracy compared to competing models in its category",
  "The system must appropriately protect personal data and be resilient against unauthorized access or misuse",
  "The system must be usable by people with a wide range of abilities and technical backgrounds",
  "The system must provide a clear appeals process for individuals affected by its decisions"
],correct:[1],
exp:"Privacy and security concerns protecting personal data and defending against unauthorized access, breaches, or misuse. State-of-the-art accuracy relates to reliability, broad usability relates to inclusiveness, and appeals processes relate to accountability — different principles entirely."},

{d:1,multi:false,
q:"A model trained to detect equipment failures performs excellently during initial testing but its accuracy steadily declines over the following year as the factory upgrades its machinery. What best explains this decline?",
opts:[
  "Overfitting, because the model has memorized the exact configurations of the original machinery",
  "Data drift, because the statistical characteristics of the input data have changed as machinery was upgraded",
  "Class imbalance, because failure events became more frequent after the machinery upgrade",
  "Hallucination, because the model began generating plausible-sounding but fabricated failure predictions"
],correct:[1],
exp:"Data drift describes exactly this scenario — the real-world data distribution (now reflecting upgraded machinery) has shifted away from what the model was originally trained on, degrading accuracy over time. Overfitting is a training-time issue, class imbalance concerns label distribution, and hallucination applies to generative models fabricating content."},

{d:1,multi:false,
q:"A field technician uses a mobile app that lets them speak a question about a broken machine, receives a spoken answer, and can also point the camera at the machine to get a visual diagnosis. What best describes the AI capability required?",
opts:[
  "A single computer vision model that has been extended to also process and generate audio",
  "A multimodal AI pipeline combining speech recognition, computer vision, and speech synthesis",
  "A knowledge mining system that indexes technical manuals for full-text keyword search",
  "A regression model that predicts numeric failure probabilities based on visual sensor input"
],correct:[1],
exp:"This scenario requires several capabilities working together: speech-to-text for the spoken question, computer vision for image diagnosis, and text-to-speech for the answer — a multimodal pipeline. A single vision model doesn't inherently process audio, and knowledge mining or regression alone don't cover the interactive multimodal need."},

{d:1,multi:false,
q:"A city deploys an automated system to determine eligibility for social assistance benefits, with the underlying decision logic kept confidential as a trade secret, and applicants receiving only a 'denied' notice with no explanation. Which responsible AI principle is most directly violated?",
opts:[
  "Transparency, because applicants cannot understand the basis for the system's decisions about their eligibility",
  "Reliability and safety, because the system's decision logic has not been independently validated for accuracy",
  "Inclusiveness, because the system may not have been designed with input from diverse community stakeholders",
  "Privacy and security, because applicant data may not be adequately protected during the assessment process"
],correct:[0],
exp:"Withholding the basis for decisions and providing no explanation is the defining violation of transparency — a principle that requires AI systems to be understandable to those affected by their decisions. The other principles may also be relevant, but the described behavior centers specifically on the lack of explainability."},

{d:1,multi:false,
q:"A team collects 10,000 unlabeled customer reviews and applies an algorithm that automatically groups them into clusters based on writing style and topic similarity, without any predefined categories. What type of learning does this represent?",
opts:[
  "Supervised learning, because the algorithm is trained to predict predefined review categories",
  "Unsupervised learning, because the algorithm discovers groupings in the data without labeled examples",
  "Reinforcement learning, because the algorithm receives feedback rewards for correct groupings",
  "Semi-supervised learning, because a portion of the reviews were manually labeled before clustering"
],correct:[1],
exp:"Grouping unlabeled data based on inherent similarity, without any predefined categories or labels, is unsupervised learning (clustering). Supervised learning requires labeled training data. Reinforcement learning requires a reward signal. Semi-supervised learning requires a partially labeled dataset, which isn't the case here."},

{d:1,multi:false,
q:"Which of the following best describes a key limitation of generative AI models regarding factual reliability?",
opts:[
  "They can only generate text in the same language used in the original prompt, with no multilingual capability",
  "They may generate plausible-sounding but factually incorrect content, a behavior known as hallucination",
  "They require a labeled dataset of correct answers to be provided within every single prompt they receive",
  "They cannot generate any content related to topics outside of their specific fine-tuning dataset"
],correct:[1],
exp:"Hallucination — generating confident but factually incorrect content — is a well-documented limitation of generative AI. The other statements are false: LLMs commonly handle multiple languages, don't require labeled answers embedded in every prompt, and can generate content on broad general topics beyond narrow fine-tuning data."},

{d:1,multi:true,
q:"Which of the following are examples of natural language processing (NLP) tasks? (Select all that apply)",
opts:[
  "Determining whether a product review expresses positive, negative, or neutral sentiment",
  "Identifying and labeling the names of people, organizations, and locations mentioned in a news article",
  "Detecting whether a photograph contains a stop sign using bounding box coordinates",
  "Translating a technical manual from German into Japanese",
  "Predicting a house's sale price based on square footage, location, and number of bedrooms"
],correct:[0,1,3],
exp:"Sentiment analysis (A), named entity recognition (B), and translation (D) are all core NLP tasks that process and understand text. Detecting a stop sign in a photo (C) is a computer vision task. Predicting house prices (E) is a regression task using numeric/categorical features, not language."},

{d:1,multi:false,
q:"A company deploys a facial analysis tool in retail stores to estimate customer emotions for marketing purposes, without posting any signage or obtaining consent from customers being scanned. Which responsible AI principle is most clearly compromised?",
opts:[
  "Reliability and safety, because emotion detection from facial expressions is not always scientifically reliable",
  "Privacy and security, because biometric facial data is being collected and processed without consent or disclosure",
  "Inclusiveness, because the emotion detection model may perform inconsistently across different demographic groups",
  "Fairness, because the marketing insights generated could be used to treat certain customers differently"
],correct:[1],
exp:"Collecting biometric facial data without consent or disclosure is a direct privacy and security violation. While reliability, inclusiveness, and fairness could also be valid secondary concerns depending on system performance, the scenario centers specifically on unauthorized, non-consensual data collection."},

{d:1,multi:false,
q:"In a supervised learning model built to predict whether an email is spam, what role does the 'spam' or 'not spam' label play during training?",
opts:[
  "It serves as an input feature the model uses alongside email content to make its prediction",
  "It serves as the known correct output the model learns to predict from the email's features",
  "It serves as a hyperparameter that controls how the model's learning rate is adjusted during training",
  "It serves as the evaluation metric used to measure the model's overall accuracy after training"
],correct:[1],
exp:"The label is the known correct answer (spam/not spam) that the model learns to predict based on input features like email content and sender. It is not itself a feature, not a hyperparameter controlling training mechanics, and not the evaluation metric — though it's used to calculate metrics like accuracy afterward."},

{d:1,multi:false,
q:"A generative AI assistant confidently cites a specific court case and its ruling to support a legal argument, but the case does not exist. What is the most accurate description of this failure, and what commonly causes it?",
opts:[
  "Data drift; the court case existed at training time but has since been overturned or removed from legal records",
  "Hallucination; the model generates statistically plausible text patterns without verifying the underlying facts",
  "Overfitting; the model has memorized too many real court cases and confuses their details with each other",
  "Class imbalance; the training data contained too few examples of real court cases relative to other legal text"
],correct:[1],
exp:"Hallucination describes exactly this — generating fabricated but plausible-sounding facts (like a fake court case) because the model predicts likely-sounding text rather than verifying real-world accuracy. Data drift concerns shifting real-world data, overfitting concerns training performance, and class imbalance concerns label distribution — none match fabricating a nonexistent case."},

{d:1,multi:false,
q:"Before deploying a new hiring AI tool, a company runs the system against thousands of historical applications to compare its recommendations to actual (fair) hiring outcomes, and adjusts the model when discrepancies are found. This practice most directly supports which principle?",
opts:[
  "Fairness, because the process actively tests for and works to correct biased outcomes before deployment",
  "Transparency, because the testing process is documented and shared publicly with all applicants",
  "Privacy and security, because historical application data is anonymized before being used in testing",
  "Inclusiveness, because the testing process includes applicants from a wide range of backgrounds"
],correct:[0],
exp:"Actively testing for biased outcomes and correcting the model in response is a direct fairness practice — proactively identifying and mitigating disparate impact before deployment. The scenario doesn't describe public documentation (transparency), anonymization (privacy), or deliberately diverse test data (inclusiveness) as its main focus."},

{d:1,multi:false,
q:"Which computer vision task would be most appropriate for a security system that needs to draw a bounding box around every person visible in a live camera feed, along with a confidence score for each detection?",
opts:[
  "Image classification, which assigns one overall label describing the entire scene in the frame",
  "Object detection, which identifies the location and confidence of multiple objects within a single image",
  "Semantic segmentation, which classifies every individual pixel in the frame into a category",
  "Optical character recognition, which extracts any printed or handwritten text visible in the frame"
],correct:[1],
exp:"Object detection identifies the location of one or more objects using bounding boxes, along with confidence scores — matching this exact requirement. Image classification gives just one label for the whole frame. Semantic segmentation labels every pixel, which is more granular than needed. OCR reads text, not people."},

{d:1,multi:false,
q:"Which of the following most accurately distinguishes a foundation model from a traditional, narrowly trained machine learning model?",
opts:[
  "Foundation models are trained on broad, diverse data and can be adapted to many different downstream tasks, while traditional models are typically trained for one specific task",
  "Foundation models can only be used for text generation, while traditional models can be used for any type of prediction task",
  "Foundation models require no training data whatsoever, while traditional models require large labeled datasets",
  "Foundation models are always smaller and faster to run than traditional narrowly trained models"
],correct:[0],
exp:"Foundation models are pre-trained on broad, diverse datasets and can be adapted (via prompting or fine-tuning) to many different tasks, unlike traditional models built for one narrow purpose. The other statements are false — foundation models support far more than text generation, do require substantial training data, and are typically larger, not smaller."},

{d:1,multi:false,
q:"A travel company wants to automatically extract the departure city, destination city, and travel date from customer emails written in free-form natural language. Which NLP capability is most directly suited to this task?",
opts:[
  "Sentiment analysis, which would determine whether the customer's tone is positive or negative",
  "Named entity recognition, which would identify and extract specific entities like locations and dates",
  "Language detection, which would determine which language each customer email is written in",
  "Text summarization, which would condense each email into a shorter version"
],correct:[1],
exp:"Named entity recognition (NER) identifies and extracts specific entity types like locations and dates from free text — exactly matching this requirement. Sentiment analysis measures emotional tone, language detection identifies the language used, and summarization condenses text, none of which extract specific structured entities like cities and dates."},

{d:1,multi:false,
q:"A generative AI model is configured with a high temperature setting for a creative writing application. What tradeoff should the developer expect?",
opts:[
  "Outputs will be more creative and varied, but potentially less predictable and occasionally less coherent",
  "Outputs will be shorter and more concise, since high temperature reduces the maximum token length",
  "Outputs will be more factually accurate, since high temperature increases the model's access to verified sources",
  "Outputs will be identical across repeated requests, since high temperature stabilizes token selection"
],correct:[0],
exp:"Higher temperature increases randomness in token selection, producing more varied and creative outputs at the cost of predictability and occasionally coherence. It does not affect maximum token length, has no relationship to factual accuracy or source verification, and does not produce identical repeated outputs — that's the effect of low temperature."},

{d:1,multi:true,
q:"Which of the following scenarios describe appropriate applications of knowledge mining? (Select all that apply)",
opts:[
  "Making thousands of scanned legal contracts full-text searchable and extracting key clauses automatically",
  "Building a searchable index of a company's internal technical documentation, PDFs, and support articles",
  "Generating a brand-new marketing slogan for an upcoming product launch",
  "Extracting structured insights and entities from a large archive of historical news articles",
  "Predicting next quarter's revenue based on the previous eight quarters of sales figures"
],correct:[0,1,3],
exp:"Knowledge mining extracts structured, searchable insights from large volumes of unstructured content: legal contracts (A), internal documentation (B), and historical news archives (D) are all classic use cases. Generating a new slogan (C) is a generative AI task. Predicting revenue (E) is a regression/forecasting task — neither involves mining existing content for insights."},

{d:1,multi:false,
q:"Why is establishing clear ownership and human accountability considered essential when deploying AI systems that influence high-stakes decisions, such as medical diagnoses or loan approvals?",
opts:[
  "It ensures the AI model always achieves the highest possible benchmark accuracy score before deployment",
  "It ensures there is a responsible party who can be held answerable for the system's outcomes and provide recourse when errors occur",
  "It ensures the AI model's response time remains below a specific latency threshold in production",
  "It ensures the AI model is compatible with the widest possible range of downstream software integrations"
],correct:[1],
exp:"Accountability ensures a responsible party exists to answer for outcomes and provide recourse — critical for high-stakes decisions with real consequences for people. Benchmark accuracy, latency, and integration compatibility are all technical or performance considerations unrelated to the accountability principle."},

{d:1,multi:false,
q:"Which scenario best illustrates the use of reinforcement learning rather than supervised learning?",
opts:[
  "Training a model on thousands of labeled X-ray images to classify them as showing a fracture or not",
  "Training an autonomous drone to navigate a warehouse by rewarding it for reaching destinations quickly and penalizing collisions",
  "Training a model on historical housing data with known sale prices to predict future listing prices",
  "Training a model on a labeled dataset of customer reviews to classify sentiment as positive or negative"
],correct:[1],
exp:"Reinforcement learning is defined by an agent learning through trial and error via rewards and penalties, as in the drone navigation example. The X-ray classification, housing price prediction, and sentiment classification examples all rely on labeled training data with known correct answers — supervised learning, not reinforcement learning."},

// ── DOMAIN 2: Implementing AI Solutions with Microsoft Foundry (Q23–50) ─────
{d:2,multi:false,
q:"A developer opens Microsoft Foundry's Model Catalog to choose a foundation model for a new customer support application. Which factor would the catalog help them evaluate before deployment?",
opts:[

const LETTERS = ['A','B','C','D','E'];
const userAnswers = QUESTIONS.map(()=>new Set());
let submitted = false;

const root = document.getElementById('quiz-root');
let currentDomain = null;

QUESTIONS.forEach((item, qi) => {
  if(item.d !== currentDomain){
    currentDomain = item.d;
    const div = document.createElement('div');
    div.className = 'domain-divider';
    div.innerHTML = currentDomain === 1
      ? `<h2>Domain 1 — AI Concepts &amp; Responsible AI</h2><span>Questions 1–22 · ~44% of exam weight</span>`
      : `<h2>Domain 2 — Implementing AI Solutions with Microsoft Foundry</h2><span>Questions 23–50 · ~56% of exam weight</span>`;
    root.appendChild(div);
  }

  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'card-' + qi;

  const numDiv = document.createElement('div');
  numDiv.className = 'q-num';
  numDiv.textContent = 'QUESTION ' + (qi+1) + ' OF 50';
  if(item.multi){
    const tag = document.createElement('span');
    tag.className = 'q-tag';
    tag.textContent = 'Multi-select';
    numDiv.appendChild(tag);
  }
  card.appendChild(numDiv);

  const qText = document.createElement('p');
  qText.className = 'q-text';
  qText.textContent = item.q;
  card.appendChild(qText);

  item.opts.forEach((optText, oi) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.id = `opt-${qi}-${oi}`;
    const input = document.createElement('input');
    input.type = item.multi ? 'checkbox' : 'radio';
    input.name = 'q' + qi;
    input.value = oi;
    input.addEventListener('change', () => {
      if(submitted) return;
      if(item.multi){
        if(input.checked) userAnswers[qi].add(oi); else userAnswers[qi].delete(oi);
      } else {
        userAnswers[qi] = new Set([oi]);
      }
      updateProgress();
      saveProgress();
    });
    const letterSpan = document.createElement('span');
    letterSpan.className = 'opt-label-letter';
    letterSpan.textContent = LETTERS[oi] + '.';
    const textSpan = document.createElement('span');
    textSpan.textContent = optText;
    label.appendChild(input);
    label.appendChild(letterSpan);
    label.appendChild(textSpan);
    card.appendChild(label);
  });

  const status = document.createElement('div');
  status.className = 'q-status';
  status.id = 'status-' + qi;
  card.appendChild(status);

  root.appendChild(card);
});

function updateProgress(){
  const answered = userAnswers.filter(s => s.size > 0).length;
  document.getElementById('progress-fill').style.width = (answered/50*100) + '%';
  document.getElementById('progress-text').textContent = answered + ' of 50 answered';
  const btn = document.getElementById('submitBtn');
  if(answered === 50){
    btn.disabled = false;
    btn.textContent = 'Submit exam';
  } else {
    btn.disabled = true;
    btn.textContent = (50 - answered) + ' question' + (50-answered===1?'':'s') + ' remaining';
  }
}

document.getElementById('submitBtn').addEventListener('click', () => {
  submitted = true;
  document.body.classList.add('submitted');
  sessionStorage.removeItem('ai901_v4');

  let correctCount = 0;
  let d1Total = 0, d1Correct = 0, d2Total = 0, d2Correct = 0;

  QUESTIONS.forEach((item, qi) => {
    const correctSet = new Set(item.correct);
    const userSet = userAnswers[qi];
    const isRight = correctSet.size === userSet.size && [...correctSet].every(x => userSet.has(x));
    if(isRight) correctCount++;
    if(item.d === 1){ d1Total++; if(isRight) d1Correct++; }
    else { d2Total++; if(isRight) d2Correct++; }

    item.opts.forEach((optText, oi) => {
      const optEl = document.getElementById(`opt-${qi}-${oi}`);
      const input = optEl.querySelector('input');
      input.disabled = true;
      if(correctSet.has(oi)){
        optEl.classList.add('correct-answer');
      } else if(userSet.has(oi)){
        optEl.classList.add('wrong-pick');
      }
    });

    const statusEl = document.getElementById('status-' + qi);
    statusEl.classList.add('show');
    statusEl.innerHTML = `<span class="tag ${isRight?'right':'wrong'}">${isRight?'Correct':'Incorrect'}</span><div class="explain">${item.exp}</div>`;
  });

  const pct = Math.round(correctCount/50*100);
  const scaled = Math.round(correctCount/50*1000);
  const passed = scaled >= 700;

  const banner = document.getElementById('results-banner');
  banner.style.display = 'block';
  banner.innerHTML = `
    <div class="score-card">
      <div class="big-score">${correctCount}/50</div>
      <div class="scaled">${pct}% correct &nbsp;·&nbsp; scaled score ≈ ${scaled}/1000</div>
      <div class="pass-pill ${passed?'pass':'fail'}">${passed?'PASS':'BELOW PASSING (700)'}</div>
      <div class="domain-breakdown">
        <div><div class="d-label">Domain 1 · Concepts</div><div class="d-score">${d1Correct}/${d1Total}</div></div>
        <div><div class="d-label">Domain 2 · Foundry</div><div class="d-score">${d2Correct}/${d2Total}</div></div>
      </div>
      <br>
      <button id="jumpToReview">Review all questions</button>
      <div class="export-btns">
        <button class="export-btn pdf" onclick="printPDF()">🖨️ Save as PDF</button>
        <button class="export-btn dl" onclick="downloadHTML()">⬇️ Download Results HTML</button>
      </div>
    </div>
  `;
  document.getElementById('jumpToReview').addEventListener('click', () => {
    document.getElementById('card-0').scrollIntoView({behavior:'smooth',block:'start'});
  });
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ── sessionStorage: save & restore in-progress answers ── */
function saveProgress(){
  try{ sessionStorage.setItem('ai901_v4', JSON.stringify(userAnswers.map(s=>[...s]))); }catch(e){}
}
function restoreProgress(){
  try{
    const raw = sessionStorage.getItem('ai901_v4');
    if(!raw) return;
    const data = JSON.parse(raw);
    data.forEach((arr, qi) => {
      if(!arr.length) return;
      userAnswers[qi] = new Set(arr);
      arr.forEach(oi => {
        const input = document.querySelector(`input[name="q${qi}"][value="${oi}"]`);
        if(input) input.checked = true;
      });
    });
    updateProgress();
  }catch(e){}
}

/* ── Save as PDF ── */
function printPDF(){ window.print(); }

/* ── Download static results HTML ── */
function downloadHTML(){
  const L = ['A','B','C','D','E'];
  let correct=0,d1C=0,d1T=0,d2C=0,d2T=0;
  const results = QUESTIONS.map((item,qi)=>{
    const cs=new Set(item.correct),us=userAnswers[qi];
    const ok=cs.size===us.size&&[...cs].every(x=>us.has(x));
    if(ok)correct++;
    if(item.d===1){d1T++;if(ok)d1C++;}else{d2T++;if(ok)d2C++;}
    return{ok,cs,us};
  });
  const pct=Math.round(correct/50*100),scaled=Math.round(correct/50*1000),passed=scaled>=700;
  const date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  let qHTML='';let curD=null;
  QUESTIONS.forEach((item,qi)=>{
    const{ok,cs,us}=results[qi];
    if(item.d!==curD){
      curD=item.d;
      qHTML+=curD===1
        ?`<div class="dd"><h2>DOMAIN 1 — AI CONCEPTS &amp; RESPONSIBLE AI</h2><span>Questions 1–22 · ~44% of exam weight</span></div>`
        :`<div class="dd"><h2>DOMAIN 2 — IMPLEMENTING AI SOLUTIONS WITH MICROSOFT FOUNDRY</h2><span>Questions 23–50 · ~56% of exam weight</span></div>`;
    }
    let optsHTML='';
    item.opts.forEach((t,oi)=>{
      const ic=cs.has(oi),iw=us.has(oi)&&!ic;
      const cls=ic?'correct':iw?'wrong':'';
      const icon=ic?'✓ ':iw?'✗ ':'';
      optsHTML+=`<div class="opt ${cls}"><span class="lt">${icon}${L[oi]}.</span><span>${t}</span></div>`;
    });
    qHTML+=`<div class="qc"><div class="qn">QUESTION ${qi+1} OF 50${item.multi?' <span class="mt">MULTI-SELECT</span>':''}</div><div class="qt">${item.q}</div>${optsHTML}<div class="ex"><span class="badge ${ok?'right':'wrong'}">${ok?'Correct':'Incorrect'}</span>${item.exp}</div></div>`;
  });

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI-901 Results — ${date}</title><style>:root{--good:#1c6e3e;--good-bg:#e6f4ea;--bad:#a02b2b;--bad-bg:#fbe9e7;--azure:#0a4d8c;--line:#d8d3c4;--ink:#1a2332;--muted:#6b6557;}*{box-sizing:border-box;}body{margin:0;background:#f7f5f0;color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;padding-bottom:40px;}header{background:var(--azure);color:#fff;padding:24px 20px 20px;}header h1{margin:0 0 4px;font-size:1.4rem;}header p{margin:0;color:#cfe3f5;font-size:.85rem;}main{max-width:700px;margin:0 auto;padding:20px;}.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center;margin-bottom:24px;}.big{font-size:2.4rem;font-weight:800;color:var(--azure);line-height:1;}.sub{color:var(--muted);font-size:.9rem;margin-top:4px;}.pill{display:inline-block;margin-top:10px;padding:5px 16px;border-radius:20px;font-weight:700;font-size:.85rem;}.pill.pass{background:var(--good-bg);color:var(--good);}.pill.fail{background:var(--bad-bg);color:var(--bad);}.bk{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap;}.bk div{flex:1;min-width:120px;background:#f7f5f0;border:1px solid var(--line);border-radius:8px;padding:10px;}.dl{font-size:.7rem;color:var(--muted);text-transform:uppercase;}.ds{font-size:1.2rem;font-weight:700;}.dd{margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--ink);}.dd h2{font-size:.9rem;margin:0;letter-spacing:.04em;}.dd span{font-size:.74rem;color:var(--muted);}.qc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;page-break-inside:avoid;break-inside:avoid;}.qn{font-size:.7rem;font-weight:700;color:#0f6cbd;letter-spacing:.04em;margin-bottom:6px;}.mt{font-size:.6rem;background:#f0ede4;border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-left:6px;color:var(--muted);font-weight:400;}.qt{font-size:.95rem;font-weight:600;margin:0 0 10px;}.opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:7px;margin-bottom:5px;border:1px solid transparent;font-size:.88rem;}.opt.correct{background:var(--good-bg);border-color:var(--good);}.opt.wrong{background:var(--bad-bg);border-color:var(--bad);}.lt{font-weight:700;flex-shrink:0;min-width:22px;}.opt.correct .lt{color:var(--good);}.opt.wrong .lt{color:var(--bad);}.ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.84rem;}.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-right:6px;}.badge.right{background:var(--good-bg);color:var(--good);}.badge.wrong{background:var(--bad-bg);color:var(--bad);}@media print{body{background:#fff!important;}.opt.correct,.opt.wrong,.badge,.pill{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.qc{break-inside:avoid;}}</style></head><body><header><h1>AI-901 Practice Exam — Results</h1><p>Completed ${date}</p></header><main><div class="sc"><div class="big">${correct}/50</div><div class="sub">${pct}% correct &nbsp;·&nbsp; scaled score ≈ ${scaled}/1000</div><div class="pill ${passed?'pass':'fail'}">${passed?'PASS':'BELOW PASSING (700)'}</div><div class="bk"><div><div class="dl">Domain 1 · Concepts</div><div class="ds">${d1C}/${d1T}</div></div><div><div class="dl">Domain 2 · Foundry</div><div class="ds">${d2C}/${d2T}</div></div></div></div>${qHTML}</main></body></html>`;

  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='AI-901_Results_v4_'+new Date().toISOString().slice(0,10)+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

updateProgress();
restoreProgress();
</script>
